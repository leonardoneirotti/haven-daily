# Site speed, before and after (issue #104): the sample site built from main ("before") and
# from this branch ("after"), measured one after the other on the same GitHub runner with
# tools/measure_speed.mjs, on the throttled phone profile and the laptop profile (#111). A runner
# has more memory than the owner's laptop and no graphics chip, so it also shows how the chart
# behaves without one.
#
# Measures the sample site only. Changes nothing, publishes nothing, uses no secrets.
# The local server listens on 127.0.0.1 and the pages load nothing from other sites.
# Results: in the run's log and its summary page.
name: Speed

on:
  workflow_dispatch:
  push:
    branches: ["issue-104-*", "issue-102-*", "issue-111-*"] # the speed work (#104), the style pass (#102), map interaction (#111)
    paths:
      - static/**
      - templates/**
      - haven/render.py
      - tools/measure_speed.mjs
      - tools/speed_compare.mjs
      - tools/check_map_input.mjs
      - tools/build_basemap.py
      - .github/workflows/speed.yml

# Read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAVEN_BROWSER: google-chrome
      # Chrome's sandbox can't start on Ubuntu runners (AppArmor); the browser only ever
      # opens our own sample site on 127.0.0.1.
      HAVEN_BROWSER_ARGS: --no-sandbox
      PAGES: today,day-ships,archive,how-it-works
      # "Before" is main; for the second #104 pull request, the first one's branch until it is
      # merged, so each pull request is measured on its own changes.
      BEFORE: ${{ github.ref_name == 'issue-104-lighter-map' && 'origin/issue-104-load-first' || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main too, for the "before" site

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the sample site, before and after (this branch)
        run: |
          python -m haven.render --briefs data/sample/briefs --out "$RUNNER_TEMP/after"
          git worktree add "$RUNNER_TEMP/main" "$BEFORE"
          (cd "$RUNNER_TEMP/main" && python -m haven.render --briefs data/sample/briefs --out "$RUNNER_TEMP/before")

      # Node 22+ has WebSocket built in; an older Node on the image gets the "ws" package.
      - name: Check Node
        run: |
          node --version
          node -e "process.exit(globalThis.WebSocket ? 0 : 1)" || npm install --no-save ws@8.18.0
          google-chrome --version
          free -m

      # The same measuring script (this branch's) for both sites.
      - name: Measure before
        timeout-minutes: 35
        run: node tools/measure_speed.mjs "$RUNNER_TEMP/before" --runs 3 --profiles phone,laptop --pages "$PAGES" --json "$RUNNER_TEMP/before.json"

      - name: Measure after
        timeout-minutes: 35
        run: node tools/measure_speed.mjs "$RUNNER_TEMP/after" --runs 3 --profiles phone,laptop --pages "$PAGES" --json "$RUNNER_TEMP/after.json"

      - name: Compare
        run: |
          node tools/speed_compare.mjs "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" --profile phone | tee -a "$GITHUB_STEP_SUMMARY"
          node tools/speed_compare.mjs "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" --profile laptop | tee -a "$GITHUB_STEP_SUMMARY"

      # How the chart takes the mouse, wheel, touchpad, keys and touch, before and after (#111).
      - name: Map input
        timeout-minutes: 15
        run: node tools/check_map_input.mjs "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" | tee -a "$GITHUB_STEP_SUMMARY"
