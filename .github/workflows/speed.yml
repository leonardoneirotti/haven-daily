# Site speed measurement (issue #104): the same script as on the owner's laptop
# (tools/measure_speed.mjs), on a GitHub runner with more memory, so a slow result
# can be told apart from a laptop that is short of memory.
#
# Measures the sample site only. Changes nothing, publishes nothing, uses no secrets.
# The local server listens on 127.0.0.1 and the pages load nothing from other sites.
# Results: in the run's log and its summary page.
name: Speed

on:
  workflow_dispatch:
  push:
    branches: [issue-104-site-speed]
    paths:
      - tools/measure_speed.mjs
      - .github/workflows/speed.yml

# Read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the sample site
        run: python -m haven.render --briefs data/sample/briefs --out "$RUNNER_TEMP/site"

      # Node 22+ has WebSocket built in; an older Node on the image gets the "ws" package.
      - name: Check Node
        run: |
          node --version
          node -e "process.exit(globalThis.WebSocket ? 0 : 1)" || npm install --no-save ws@8.18.0
          google-chrome --version
          free -m

      # The full measurement on a manual run; a push to the branch runs only the experiments.
      # --no-sandbox: Chrome's sandbox can't start on Ubuntu runners (AppArmor); the
      # browser only ever opens our own sample site on 127.0.0.1.
      - name: Measure
        if: github.event_name == 'workflow_dispatch'
        env:
          HAVEN_BROWSER: google-chrome
          HAVEN_BROWSER_ARGS: --no-sandbox
        run: |
          node tools/measure_speed.mjs "$RUNNER_TEMP/site" --runs 3 --json "$RUNNER_TEMP/speed.json" | tee "$RUNNER_TEMP/speed.txt"
          { echo '```'; cat "$RUNNER_TEMP/speed.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Experiments for the proposed fixes, without changing the site: the same pages with
      # extra CSS or preload links added by the measuring script before the first layout.
      - name: Experiments
        env:
          HAVEN_BROWSER: google-chrome
          HAVEN_BROWSER_ARGS: --no-sandbox
        run: |
          LAZY='.brief-layout,.about,.ship-list,.notes,.day-nav,.prose > section,.site-footer{content-visibility:auto;contain-intrinsic-size:auto 700px}'
          FONTS='static/fonts/ibm-plex-sans-400-700-latin.woff2,static/fonts/ibm-plex-sans-condensed-700-latin.woff2,static/fonts/ibm-plex-sans-condensed-600-latin.woff2,static/fonts/ibm-plex-mono-600-latin.woff2'
          NOWATER='(function () { var stroke = CanvasRenderingContext2D.prototype.stroke; CanvasRenderingContext2D.prototype.stroke = function () { if (!this.canvas.isConnected && this.lineWidth > 3) return; return stroke.apply(this, arguments); }; })();'
          run() { echo "### $1"; shift; node tools/measure_speed.mjs "$RUNNER_TEMP/site" --runs 3 --pages today,how-it-works --no-interact "$@" | grep -v "load JS\|last file"; }
          { run "baseline"
            run "lazy layout of sections below the first screen" --css "$LAZY"
            run "the four first-screen fonts preloaded" --preload "$FONTS"
            run "both" --css "$LAZY" --preload "$FONTS"
            run "no web fonts at all (lower bound)" --block "*.woff2"
            echo "### map, as it is"
            node tools/measure_speed.mjs "$RUNNER_TEMP/site" --runs 3 --pages today --profiles laptop | grep -v "load JS\|last file\|JS:"
            echo "### map without the water lines (the wide strokes on the off-screen water canvas are skipped)"
            node tools/measure_speed.mjs "$RUNNER_TEMP/site" --runs 3 --pages today --profiles laptop --js "$NOWATER" | grep -v "load JS\|last file\|JS:"
          } | tee "$RUNNER_TEMP/experiments.txt"
          { echo '```'; cat "$RUNNER_TEMP/experiments.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
