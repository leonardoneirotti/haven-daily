# TEMPORARY (#125): checks that today's files pass from the build job to the publish job intact.
# Fake files dated 2099-01-01; read-only; nothing is committed or published. Removed before merge.
name: Artifact check (temporary)
on:
  push:
    branches: [issue-125-security-hardening]
    paths: [.github/workflows/artifact-check.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: day
        run: echo "day=2099-01-01" >> "$GITHUB_OUTPUT"
      - run: |
          echo '{"date": "2099-01-01"}' > data/briefs/2099-01-01.json
          echo '{}' > data/items/2099-01-01.jsonl
          echo '{}' > data/status/2099-01-01.json
          echo '{}' > data/briefs/2099-01-02.json
          git config --get-regexp 'http\..*extraheader' && echo "CREDENTIALS KEPT" || echo "no credentials kept"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brief-data
          path: data/*/${{ steps.day.outputs.day }}.*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brief-data
          path: data
      - run: |
          git add --all -- data
          git status --porcelain
          test "$(git status --porcelain | wc -l)" = 3
          test -f data/briefs/2099-01-01.json && test -f data/items/2099-01-01.jsonl && test -f data/status/2099-01-01.json
          echo "ARTIFACT OK: exactly today's 3 files, at their data/ paths"
