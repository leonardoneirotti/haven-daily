# Build the site from the briefs and publish it on GitHub Pages.
# Runs on every push to main, and by hand from the Actions tab ("Run workflow").
# The built site/ folder is never committed: it only exists inside this job.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what deploying to Pages needs: read the code, publish Pages, prove the
# deployment comes from this repository (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Get a copy of the repository's code and briefs.
      - uses: actions/checkout@v7

      # Install Python 3.12; cache pip downloads between runs to save time.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # For now the sample briefs (the renderer's default input). Later: data/briefs.
      - name: Render the site
        run: python -m haven.render --briefs data/sample/briefs --out site

      # Read this repo's Pages settings (address, base path) for the deploy.
      - uses: actions/configure-pages@v6

      # Pack site/ into the artifact the deploy job publishes.
      # Since v4, dotfiles are left out; site/ has none, so nothing is lost.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publish the artifact from the build job to GitHub Pages.
      - id: deployment
        uses: actions/deploy-pages@v5
