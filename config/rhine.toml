# Haven Daily: thresholds of the Rhine status line at the Kaub gauge (spec §2.2, issue #20).
#
# Values in centimetres on the Kaub gauge board (PEGELONLINE "W"), whole numbers only.
#   Alert  at alert_at_or_below or lower, or above alert_above
#   Watch  at watch_at_or_below or lower, or above watch_above
#   Normal in between (151-460 cm with the numbers below)
#
# Low side: owner's decision 2 Nov 2026 (PR #71), from the barge operators' low-water
# surcharge tables, read 2 Nov 2026 (docs/research/barge-surcharge.md):
#   150 cm  Contargo's first surcharge step (terminals south of Koblenz); Maersk's Rhine
#           barge surcharge starts at the same level
#    80 cm  Contargo "by agreement", Maersk "no loading guarantee" below 81 cm
# High side: WSV's official values for Kaub (PEGELONLINE characteristicValues, read 31 Oct 2026):
#   460 cm  Marke I (high-water shipping restrictions)
#   640 cm  Marke II / HSW (shipping stops)
# The numbers are written here on purpose, not read from the API each morning.
#
# A reading below the record low (NNW 25 cm) is a valid Alert, not an error.
# Read and checked by haven/config.py; used by haven/rhine.py.

[kaub]
alert_at_or_below = 80
watch_at_or_below = 150
watch_above = 460
alert_above = 640

# What each level means for a planner, shown next to the level on the page (issue #83, design
# review S6): "16 cm · Alert: barge transport no longer guaranteed". One line each, from the same
# sources as the numbers above, which the Method page links. Change a number and its text together.
# Wording: Claude's proposal (#83), not yet confirmed by the owner.
[kaub.meaning]
normal = "no low-water surcharge or high-water restriction at Kaub"  # between watch_at_or_below and watch_above
watch_low = "low-water surcharges on barge transport"                 # Contargo / Maersk surcharges start at 150
alert_low = "barge transport no longer guaranteed"                    # Contargo "by agreement", Maersk "no loading guarantee"
watch_high = "high-water shipping restrictions"                       # above Marke I
alert_high = "high water: shipping stops"                             # above Marke II / HSW
