# Haven Daily: the fixed place list (gazetteer) for map pins (spec §5.10).
#
# The summariser picks ONE place id from this list, or "none". The code then adds
# the coordinates, label and label side to the item (items[].map), so the AI never
# writes a coordinate. A place it names that is not here is dropped from the item
# and logged on the item's line in data/items/ ("unlisted"), for the owner to review.
#
# Fields:
#   id     what the AI answers (lowercase letters, digits and -; never "none")
#   label  shown on the chart, and usable as an "affects" location tag
#   kind   terminal / area / anchorage / lock / barrier / bridge / fairway
#   lat, lon  taken ONCE from OpenStreetMap (Overpass, 2 Nov 2026): the centre of the
#          element named in `osm` (a node's own position). Never from the AI.
#   side   "right" or "left" of the pin number; "left" where the right is crowded
#   osm    the OpenStreetMap element the coordinates come from (node/way/relation + id),
#          so anyone can check it on https://www.openstreetmap.org/<osm>
# Every place must lie inside the chart sheet (51.74, 3.40, 52.16, 4.62; spec §8.1).
# Read and checked by haven/config.py; used by haven/places.py.
# Map data © OpenStreetMap contributors (ODbL).

