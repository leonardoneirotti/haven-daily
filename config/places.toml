# ---------- Roads (the port's motorways, #138) ----------
# A road is long, so its pin is one point on the motorway itself, on its stretch inside the port:
# a junction node on the carriageway (highway=motorway_junction, checked to lie on a way with
# ref=A15 / ref=A20), read with an Overpass query on 24 Nov 2026. Added because the A15/A20 road
# works of 23 Nov 2026 got no pin: the list had no roads, so "none" was the only right answer.
# A road is only a fallback: a more specific place the item names wins (places.prefer_specific).
# Not the junctions with the A4 (Benelux, Kethelplein) any more: further east, they hid 4 more pin
# pairs at the opening view (owner's option A, review of PR #139).

[[place]]
# Exit 15 (Havens 4100-5200), 1.0 km from the Botlek pin
