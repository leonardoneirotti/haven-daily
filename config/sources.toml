# Haven Daily: news sources the collector reads (spec §4, SOURCES.md).
#
# Keep this file and SOURCES.md in step: tests/test_repo_config.py fails if
# names, verdicts or URLs differ. Read and checked by haven/config.py.
#
# Fields
#   id         short unique name, used in data files and error messages
#   name       as written in SOURCES.md
#   verdict    "use" (headline + link + own-words summary)
#              "headline-only" (headline + link; article text never goes to an AI, hard rule 12)
#              "drop" (listed for the record, never fetched)
#   home       the source's normal public page: its name links here on the Method page
#              (required unless dropped, tests/test_repo_config.py; owner, PR #76)
#   urls       one or more feed/page addresses the job reads (required unless dropped);
#              the first is the "(feed)" link (RSS) or "(page)" link (HTML) on the Method page
#   access     "rss" or "html" (required unless dropped)
#   language   two-letter code of the source's text: "en" or "nl" (required unless dropped)
#   auto_keep  true = skips the AI relevance check (spec §5.4); default false
#   note       optional, for people reading this file only; never shown on the site
#   why        one public line shown on the Method page (issue #24): why a source is
#              headline-only or dropped (required for those, tests/test_repo_config.py),
#              or how a "use" source is limited
#   permission optional, one line, only on a headline-only source: the publisher's written
#              permission for AI summaries (spec §3 rule 12, §11; #107). It overrides the
#              publisher's robots.txt AI block for that publisher only, and the source is
#              summarised (listed under Use in SOURCES.md). Fields: file (the saved reply in
#              docs/permissions/), granted (date received), max_sentences (checked in code),
#              impact (false = no "impact for planners" line; true = the line, labelled as
#              Haven Daily's interpretation and written as possible, checked in code, #115).
#              Optional: newspaper (true = the newspaper view shows the summary too, #101; left out
#              = headline-only there, until the publisher agrees to that new way of showing its
#              items, spec §11 condition 5).
#              Permission withdrawn: delete the line, and move its row back under
#              Headline-only in SOURCES.md.
#   english_headline  true = for an item in Dutch, the AI also writes an English headline,
#              shown as the main one with the Dutch original below it, "translated by AI"
#              (#134). Only for a summarised source (verdict "use", or with permission);
#              default false. The item's language decides, so an English item is untouched.
#   enabled    false = paused: kept here with its verdict and URLs, but not read and not
#              shown as a failure; How it works lists it as paused (#138). Default true.

# --- use ----------------------------------------------------------------------

[[source]]
id = "port-authority-news"
name = "Port of Rotterdam Authority news & press releases"
verdict = "use"
