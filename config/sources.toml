# Haven Daily: news sources the collector reads (spec §4, SOURCES.md).
#
# Keep this file and SOURCES.md in step: tests/test_repo_config.py fails if
# names, verdicts or URLs differ. Read and checked by haven/config.py.
#
# Fields
#   id         short unique name, used in data files and error messages
#   name       as written in SOURCES.md
#   verdict    "use" (headline + link + own-words summary)
#              "headline-only" (headline + link; article text never goes to an AI, hard rule 12)
#              "drop" (listed for the record, never fetched)
#   urls       one or more feed/page addresses (required unless dropped)
#   access     "rss" or "html" (required unless dropped)
#   language   two-letter code of the source's text: "en" or "nl" (required unless dropped)
#   auto_keep  true = skips the AI relevance check (spec §5.4); default false
#   note       optional, for people only

# --- use ----------------------------------------------------------------------

[[source]]
id = "port-authority-news"
name = "Port of Rotterdam Authority news & press releases"
verdict = "use"
urls = ["https://www.portofrotterdam.com/en/news-and-press-releases"]
access = "html"
language = "en"
auto_keep = true
note = "The /en/rss.xml feed is stale; read the HTML list."

[[source]]
id = "pin-notices"
name = "PIN notices to shipping"
verdict = "use"
urls = ["https://pin.portofrotterdam.com/rss.xml"]
access = "rss"
language = "en"
note = "40-60 notices a week, mostly noise: goes through the AI check. Feed keeps only ~10 items (gap detection, spec §5.8)."

[[source]]
id = "contargo-news"
name = "Contargo business news"
verdict = "use"
urls = ["https://www.contargo.net/en/business/business-news"]
access = "html"
language = "en"

[[source]]
id = "ect-news"
name = "ECT news"
verdict = "use"
urls = ["https://www.ect.nl/en/news-feed"]
access = "html"
language = "en"
auto_keep = true
note = "The /en/rss.xml feed is stale; read the HTML list."

[[source]]
id = "kn-seanews"
name = "Kuehne+Nagel SeaNews"
verdict = "use"
urls = ["https://mykn.kuehne-nagel.com/news"]
access = "html"
language = "en"
note = "Rotterdam paragraph of the weekly port update only. Terms not found yet: check before launch (spec §11)."

