# The site's own addresses and its social preview image (spec §2.3, §7.7; issue #28).
# Read by haven/config.py (load_site). Used by the renderer (footer, "How it works", the Today
# page's About block, the og:/twitter: preview tags) and by the fetcher (its user agent links
# "How it works"). Templates never have these written in.

# Where the site is published, ending with "/": page addresses are this + "days/2026-10-29.html".
# GitHub Pages for now; change it here if the site moves to its own domain (havendaily.nl, §11).
base_url = "https://leonardoneirotti.github.io/haven-daily/"

# The owner's links (given 2 Nov 2026, PR #80; shown since #86).
linkedin_url = "https://www.linkedin.com/in/leonardo-neirotti"
repo_url = "https://github.com/leonardoneirotti/haven-daily"

# The social preview card (og:image): a 1200 x 630 PNG in static/, made by
# tools/make_social_preview.py (§7.7, #95). Every page links it; without the file, or at another
# size (LinkedIn would crop it), pages have no og:image. The alt text says what the card shows:
# change it when the script draws something else.
social_image = "social-preview.png"
social_image_alt = 'Dark card with a short orange line above "Haven Daily" in large ivory letters, under it the line "What affects the Port of Rotterdam today, and what it means for logistics planners. Updated every morning." and, small at the bottom, "Independent portfolio project".'
